name: Sync Excel from OneDrive

on:
  schedule:
    - cron: '*/15 * * * *'   # tu dong moi 15 phut
  workflow_dispatch: {}       # nut "Run workflow" de chay tay

# Khong cho 2 luot chay cung luc: luot sau doi luot truoc xong
concurrency:
  group: sync-excel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai trinh duyet ao (Playwright)
        run: |
          npm init -y --silent
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Tai file Excel bang trinh duyet ao
        env:
          EXCEL_URL: ${{ secrets.EXCEL_DOWNLOAD_URL }}
        run: |
          if [ -z "$EXCEL_URL" ]; then echo "::error::Chua tao Secret EXCEL_DOWNLOAD_URL"; exit 1; fi
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            let url = process.env.EXCEL_URL.trim();
            if (!/[?&]download=1/.test(url)) url += (url.includes('?') ? '&' : '?') + 'download=1';
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const downloadPromise = page.waitForEvent('download', { timeout: 60000 });
            await page.goto(url, { waitUntil: 'load', timeout: 60000 }).catch(() => {});
            const download = await downloadPromise;
            await download.saveAs('data.xlsx.new');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          "
          if [ "$(head -c 2 data.xlsx.new)" != "PK" ]; then
            echo "::error::File tai ve KHONG phai Excel"; exit 1
          fi

      - name: So sanh va luu neu co thay doi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            # Lay ban moi nhat tren GitHub (vd vua upload index.html, hoac luot khac vua luu)
            git fetch origin main
            git reset --hard origin/main
            if [ -f data.xlsx ] && cmp -s data.xlsx.new data.xlsx; then
              echo "Khong co thay doi, bo qua."
              exit 0
            fi
            cp data.xlsx.new data.xlsx
            git add data.xlsx
            git commit -m "Dong bo du lieu Excel tu OneDrive"
            if git push; then echo "Da luu data.xlsx moi."; exit 0; fi
            echo "Repo vua thay doi, thu lai lan $i..."
            sleep 5
          done
          echo "::error::Khong luu duoc sau 3 lan thu"; exit 1
